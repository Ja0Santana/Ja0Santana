name: Generate GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Stats Card
        uses: anuraghazra/github-readme-stats@master
        with:
          username: Ja0Santana
          path: profile-stats.svg
          stats: true
          theme: dracula
          include_all_commits: true
          count_private: true
